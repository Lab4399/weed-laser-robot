<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" font-family="Microsoft YaHei,SimHei,sans-serif">
  <rect width="980" height="360" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">植物病害识别 + 激光瞄准打击系统 —— 总体框图</text>

  <!-- 摄像头 -->
  <rect x="30" y="120" width="150" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="158" text-anchor="middle" font-size="16" fill="#075985">摄像头</text>
  <text x="105" y="180" text-anchor="middle" font-size="12" fill="#475569">USB / OpenMV</text>

  <!-- AI 识别 -->
  <rect x="215" y="120" width="170" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="150" text-anchor="middle" font-size="16" fill="#166534">AI 识别</text>
  <text x="300" y="172" text-anchor="middle" font-size="12" fill="#475569">YOLOv8 / 色斑</text>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#475569">WSL + RTX5060</text>

  <!-- 图像中心/误差 -->
  <rect x="420" y="120" width="150" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="495" y="158" text-anchor="middle" font-size="16" fill="#92400e">瞄准计算</text>
  <text x="495" y="180" text-anchor="middle" font-size="12" fill="#475569">像素误差→角度</text>

  <!-- Arduino 控制板 -->
  <rect x="605" y="120" width="160" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="155" text-anchor="middle" font-size="16" fill="#991b1b">Arduino 控制板</text>
  <text x="685" y="177" text-anchor="middle" font-size="12" fill="#475569">云台 + 激光驱动</text>

  <!-- 云台/激光 -->
  <rect x="800" y="60" width="150" height="80" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="875" y="92" text-anchor="middle" font-size="15" fill="#6b21a8">云台 2×MG90S</text>
  <text x="875" y="114" text-anchor="middle" font-size="12" fill="#475569">水平 / 俯仰</text>
  <rect x="800" y="165" width="150" height="80" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="875" y="197" text-anchor="middle" font-size="15" fill="#6b21a8">激光模块 5mW</text>
  <text x="875" y="219" text-anchor="middle" font-size="12" fill="#475569">Class 3R 红激光</text>

  <!-- 箭头 -->
  <line x1="180" y1="165" x2="215" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="385" y1="165" x2="420" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="165" x2="605" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="685" y1="120" x2="850" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="685" y1="165" x2="850" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- PC 串口 -->
  <rect x="605" y="250" width="160" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="685" y="276" text-anchor="middle" font-size="14" fill="#334155">PC 上位机</text>
  <text x="685" y="296" text-anchor="middle" font-size="11" fill="#64748b">串口 P/T/L/S</text>
  <line x1="685" y1="210" x2="685" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- 框注 -->
  <text x="490" y="340" text-anchor="middle" font-size="13" fill="#6b7280">识别→瞄准→打击；可接 GOOD DOG 底盘（STM32F407）构成“行走→识别→发射→完成”</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334155"/></marker>
  </defs>
</svg>
